[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validation-language-mockup"
version = "0.1.0"
description = "Mockup for a validation language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.2",
    "polars>=1.0",
]

[project.scripts]
vlm = "validation_language_mockup.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
notebook = [
    "marimo>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/validation_language_mockup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
